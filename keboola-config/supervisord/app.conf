[program:node-app]
command=/app/data-app/run-node.sh
directory=/app/data-app
autostart=true
autorestart=true
stderr_logfile=/tmp/node-app.err.log
stdout_logfile=/tmp/node-app.out.log
environment=PATH="/app/node-dist/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PORT="3000",NODE_ENV="production"
